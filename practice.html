<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Navigation Bar</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles1.css">
</head>
<body>
    <div class="menu">
	<input type="checkbox" id="toggle">
	<label for="toggle" id="show-menu">
	    <div class="btn">
		<i class="material-icons md-36 toggleBtn menuBtn">menu</i>
		<i class="material-icons md-36 toggleBtn closeBtn">close</i>
	    </div>

	    <div class="btn">
		<i class="material-icons md-36" id="home">home</i>
	    </div>

	    <div class="btn">
		<i class="material-icons md-36" id="blog">format_bold</i>
	    </div>

	    <div class="btn">
		<i class="material-icons md-36" id="portfolio">auto_stories</i>
	    </div>

	    <div class="btn">
		<i class="material-icons md-36" id="resume">cloud</i>
	    </div>

	    <div class="btn">
		<i class="material-icons md-36" id="contact">mail</i>
	    </div>
	</label>
    </div>
    <div class="circle"></div>
</body>
</html>
